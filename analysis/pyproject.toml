[project]
name = "familiar-analysis"
version = "0.1.0"
description = "Independent checks and measurements for Familiar: the 8-bit kernel, quantization, eval statistics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["familiar_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
